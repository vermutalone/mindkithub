<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindKitHub — гид по саморазвитию</title>
  <meta name="description" content="MindKitHub — дружелюбный навигатор по саморазвитию и обучению. Подборки курсов, книг и инструментов. Подписка на закрытые гайды.">
  <style>
    :root {
      --bg: radial-gradient(circle at top, #0f172a 0%, #020617 40%, #000 100%);
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(18px);
      background: rgba(2, 6, 23, .3);
      border-bottom: 1px solid rgba(148,163,184,0.04);
      z-index: 10;
    }
    .container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      gap: 16px;
    }
    .logo { font-weight: 700; }
    nav { display: flex; gap: 14px; align-items: center; }
    nav a { color: var(--muted); text-decoration: none; font-size: .9rem; }
    nav a:hover { color: #fff; }
    .btn {
      background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      color: #020617;
      font-weight: 600;
      cursor: pointer;
    }
    footer {
      text-align: center;
      color: rgba(148, 163, 184, .5);
      font-size: .75rem;
      margin-top: 45px;
      padding-bottom: 20px;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="logo">MindKitHub</div>
      <nav>
        <a href="index.html">Главная</a>
        <a href="faq.html">FAQ</a>
        <a href="support.html">Поддержка</a>
        <a href="legal.html">Юр. информация</a>
      </nav>
      <button class="btn" onclick="goTG()">В Telegram</button>
    </div>
  </header>

  <!-- основной контент оставь без изменений -->

  <footer>
    © <span id="year"></span> MindKitHub · 
    <a href="mailto:mindkithub@yandex.ru">mindkithub@yandex.ru</a> · 
    <a href="https://t.me/mindkitsupportbot">@mindkitsupportbot</a>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    function goTG() { window.location.href = "https://t.me/mindkithub"; }
  </script>
</body>
</html>
