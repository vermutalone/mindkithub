<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поддержка — MindKitHub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%23020b1f'/%3E%3Ctext x='50' y='58' text-anchor='middle' font-size='34' font-family='system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif' fill='%2338bdf8'%3EMK%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: radial-gradient(circle at top, #0f172a 0%, #020617 40%, #000 100%);
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    html { background: #020617; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top:0;
      background: rgba(2,6,23,.35);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(148,163,184,0.04);
      z-index: 10;
    }
    .container { max-width: 820px; margin: 0 auto; padding: 0 16px; width: 100%; }
    .nav { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 0; }
    .logo { font-weight:700; text-decoration:none; color:inherit; }
    nav { display:flex; gap:14px; }
    nav a { color:#94a3b8; text-decoration:none; }
    nav a:hover { color:#fff; }
    .btn {
      background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
      border: none; border-radius: 999px;
      padding: 7px 14px; color: #020617; font-weight: 600;
      cursor: pointer;
    }
    main { padding: 46px 0 60px; flex:1; }
    .support-box {
      background: rgba(15,23,42,.35);
      border: 1px solid rgba(148,163,184,.06);
      border-radius: 14px;
      padding: 16px;
      margin-top: 20px;
    }
    footer {
      text-align: center;
      color: rgba(148, 163, 184, .5);
      font-size: .75rem;
      padding: 20px 16px 24px;
    }
    footer a { color:#38bdf8; text-decoration:none; }
    @media (max-width: 820px) {
      nav { display:none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="logo">MindKitHub</a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="faq.html">FAQ</a>
        <a href="support.html">Поддержка</a>
        <a href="terms.html">Terms</a>
      </nav>
      <button class="btn" onclick="goTG()">В Telegram</button>
    </div>
  </header>

  <main class="container">
    <h1>Поддержка</h1>
    <p class="muted">Если что-то не сработало — напиши, мы поможем.</p>

    <div class="support-box">
      <h3>1. Telegram-бот</h3>
      <p>Самый быстрый способ: <a href="https://t.me/mindkitsupportbot" style="color:#38bdf8;">@mindkitsupportbot</a>.</p>
    </div>

    <div class="support-box">
      <h3>2. Email</h3>
      <p>Если нужно прикрепить файл/чек/скриншот:</p>
      <p><a href="mailto:mindkithub@yandex.ru" style="color:#38bdf8;">mindkithub@yandex.ru</a></p>
    </div>
  </main>

  <footer>
    © <span id="year"></span> MindKitHub ·
    <a href="mailto:mindkithub@yandex.ru">mindkithub@yandex.ru</a> ·
    <a href="https://t.me/mindkitsupportbot">@mindkitsupportbot</a>
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    function goTG() { window.location.href = "https://t.me/mindkithub"; }
  </script>
</body>
</html>
